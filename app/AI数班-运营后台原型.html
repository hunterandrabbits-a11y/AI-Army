<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI数班 · 运营后台</title>
<!-- 运营后台原型 · 对齐 PRD-v1.4-计费规则 §9 -->
<style>
:root{
  --primary:#409eff; --primary-hover:#66b1ff; --primary-active:#3a8ee6;
  --success:#67c23a; --warning:#e6a23c; --danger:#f56c6c; --info:#909399;
  --text-1:#303133; --text-2:#606266; --text-3:#909399; --text-4:#c0c4cc;
  --border:#dcdfe6; --border-light:#ebeef5; --border-lighter:#f2f6fc;
  --bg-page:#f0f2f5; --bg-th:#f5f7fa; --bg-active:#ecf5ff;
  --radius:4px; --shadow:0 2px 12px 0 rgba(0,0,0,.06);
  --shadow-modal:0 12px 32px 4px rgba(0,0,0,.1),0 8px 20px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  font-size:14px;line-height:1.5;color:var(--text-1);background:var(--bg-page);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#c8ccd4;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局 ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--border-light);
  display:flex;flex-direction:column;transition:flex-basis .2s,width .2s;
}
.sidebar.is-collapsed{width:64px;flex-basis:64px}
.brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;flex:0 0 60px}
.brand-logo{
  width:34px;height:34px;flex:0 0 34px;border-radius:8px;
  background:conic-gradient(from 210deg,#8fd14f,#4fc3f7,#b388ff,#ffcc80,#8fd14f);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18);
}
.brand-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden}
.sidebar.is-collapsed .brand-name,.sidebar.is-collapsed .nav-label,
.sidebar.is-collapsed .nav-arrow,.sidebar.is-collapsed .nav-sub{display:none}
.nav{flex:1;overflow-y:auto;padding:6px 0 24px}
.nav-group{user-select:none}
.nav-item{
  display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;
  color:var(--text-2);cursor:pointer;position:relative;
}
.nav-item:hover{background:#f5f7fa}
.nav-item.is-open,.nav-item.is-active{color:var(--primary)}
.nav-item.is-active{background:var(--bg-active);font-weight:500}
.nav-dot{
  width:8px;height:8px;flex:0 0 8px;border-radius:50%;border:2px solid currentColor;
  color:var(--info);
}
.nav-item.is-open .nav-dot,.nav-item.is-active .nav-dot{color:var(--primary)}
.nav-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-arrow{font-size:10px;color:var(--text-4);transition:transform .2s}
.nav-item.is-open .nav-arrow{transform:rotate(90deg)}
.nav-sub{display:none;background:#fff}
.nav-item.is-open + .nav-sub{display:block}
.nav-sub .nav-item{height:40px;padding-left:44px;font-size:13px;color:var(--text-2)}
.nav-sub .nav-item:hover{color:var(--primary)}
.nav-sub .nav-item.is-active{background:var(--bg-active);color:var(--primary);font-weight:500}
.nav-collapse{
  height:40px;flex:0 0 40px;border-top:1px solid var(--border-light);
  display:flex;align-items:center;justify-content:center;color:var(--text-3);
}
.nav-collapse:hover{color:var(--primary)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:50px;flex:0 0 50px;background:#fff;border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;padding:0 20px;gap:8px;
}
.crumb{color:var(--text-3);font-size:14px}
.crumb-sep{color:var(--text-4);margin:0 2px}
.crumb-current{color:var(--text-1)}
.content{flex:1;overflow-y:auto;padding:20px}
.page{display:none}
.page.is-active{display:block}

/* ---------- 卡片 ---------- */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card:last-child{margin-bottom:0}
.card--flush{padding:0}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--border-light);
}
.card-title{font-size:16px;font-weight:600;color:var(--text-1)}
.card-title small,.form-block-title small{font-size:12px;font-weight:400;color:var(--text-3);margin-left:8px}
.card-body{padding:20px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 表单 ---------- */
.field{display:flex;align-items:center;gap:8px}
.field-label{color:var(--text-2);white-space:nowrap;font-size:14px}
.field-label.is-required::before{content:"*";color:var(--danger);margin-right:4px}
.filter-bar{display:flex;flex-wrap:wrap;gap:20px 24px;align-items:center}
.filter-bar .field{margin:0}
.filter-actions{display:flex;gap:10px;margin-left:auto}

.input,.select{
  height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);
  background:#fff;color:var(--text-1);outline:none;transition:border-color .2s;width:180px;
}
.input::placeholder{color:var(--text-4)}
.input:hover,.select:hover{border-color:var(--text-4)}
.input:focus,.select:focus{border-color:var(--primary)}
.input[readonly],.input:disabled,.select:disabled{background:#f5f7fa;color:var(--text-3);cursor:not-allowed}
.input--sm{width:120px}
.input--lg{width:240px}
.input--block{width:100%}
.select{
  appearance:none;padding-right:26px;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M2 4.5 6 8.5 10 4.5' fill='none' stroke='%23c0c4cc' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;background-size:12px;
}
.select--block{width:100%}
textarea.input{height:auto;padding:6px 10px;resize:vertical;line-height:1.5}
.field-hint{font-size:12px;color:var(--text-3);line-height:1.5}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:32px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--border);
  background:#fff;color:var(--text-2);white-space:nowrap;transition:all .2s;font-size:14px;
}
.btn:hover{color:var(--primary);border-color:#c6e2ff;background:#ecf5ff}
.btn--primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn--primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn--primary:active{background:var(--primary-active);border-color:var(--primary-active)}
.btn--lg{height:36px;padding:0 20px}
.btn--sm{height:28px;padding:0 12px;font-size:12px}
.btn:disabled,.btn.is-disabled{
  background:#fff;border-color:var(--border-light);color:var(--text-4);cursor:not-allowed;
}
.btn:disabled:hover,.btn.is-disabled:hover{background:#fff;border-color:var(--border-light);color:var(--text-4)}
.btn--text{border:none;background:none;height:auto;padding:0;color:var(--primary)}
.btn--text:hover{background:none;color:var(--primary-hover);text-decoration:none}
.btn--danger-text{color:var(--danger)}
.btn--danger-text:hover{color:#f78989}
.btn--danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn--danger:hover{background:#f78989;border-color:#f78989;color:#fff}

/* ---------- 链接与文本 ---------- */
.link{color:var(--primary);cursor:pointer}
.link:hover{color:var(--primary-hover)}
.link.is-disabled,.link.is-disabled:hover{color:var(--text-4);cursor:not-allowed}
.link--danger{color:var(--danger)}
.link--danger:hover{color:#f78989}
.link + .link{margin-left:14px}
.text-3{color:var(--text-3)}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.table th{
  background:var(--bg-th);color:var(--text-3);font-weight:500;text-align:left;
  padding:12px 12px;white-space:nowrap;border-bottom:1px solid var(--border-light);
}
.table th:first-child{border-top-left-radius:var(--radius)}
.table th:last-child{border-top-right-radius:var(--radius)}
.table td{
  padding:14px 12px;border-bottom:1px solid var(--border-light);
  color:var(--text-2);vertical-align:middle;
}
.table tbody tr:hover td{background:#fafcff}
.table tbody tr:last-child td{border-bottom:none}
.table .cell-strong{color:var(--text-1);font-weight:500}
/* 数值与时间列不折行：右侧抽屉变窄后，「50 电力值」「2026-09-24 14:35:00」容易被拆成两行 */
.table .cell-num{font-variant-numeric:tabular-nums;white-space:nowrap}
.table .cell-sub{font-size:12px;color:var(--text-3);line-height:1.5}
.table .cell-note{font-size:12px;color:var(--text-3);line-height:1.5;min-width:230px;max-width:320px}
.table--fixed{table-layout:fixed}
/* 门店行「···」下拉：挂在 #menuRoot 上做浮层，避免被表格横向滚动裁掉 */
.row-menu{position:fixed;min-width:152px;background:#fff;border:1px solid var(--border-light);
  border-radius:var(--radius);box-shadow:0 6px 20px rgba(0,0,0,.12);padding:6px 0;z-index:60}
.row-menu-item{padding:9px 18px;font-size:14px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.row-menu-item:hover{background:var(--bg-active);color:var(--primary)}
.col-check{width:44px}
.col-op{white-space:nowrap}
.col-op .link{margin-right:12px}
.col-op .link:last-child{margin-right:0}
.nw{white-space:nowrap}

/* ---------- 标签 ---------- */
.tag{
  display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--radius);
  font-size:12px;line-height:1;border:1px solid transparent;white-space:nowrap;
}
.tag--info{background:#f4f4f5;border-color:#e9e9eb;color:var(--info)}
.tag--primary{background:#ecf5ff;border-color:#d9ecff;color:var(--primary)}
.tag--success{background:#f0f9eb;border-color:#e1f3d8;color:var(--success)}
.tag--warning{background:#fdf6ec;border-color:#faecd8;color:var(--warning)}
.tag--danger{background:#fef0f0;border-color:#fde2e2;color:var(--danger)}
.tag--plain{color:var(--text-2);border-color:var(--border);background:#fff}

/* ---------- 分页 ---------- */
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:16px 0 0;font-size:13px;color:var(--text-2)}
.pager-total{margin-right:4px;color:var(--text-2)}
.pager-btn{
  min-width:28px;height:28px;padding:0 6px;border:1px solid var(--border);border-radius:var(--radius);
  background:#fff;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;
}
.pager-btn:hover:not(:disabled){color:var(--primary);border-color:#c6e2ff}
.pager-btn.is-active{background:var(--primary);border-color:var(--primary);color:#fff}
.pager-btn:disabled{color:var(--text-4);cursor:not-allowed}

/* ---------- 提示条 ---------- */
.alert{
  display:flex;gap:10px;padding:10px 14px;border-radius:var(--radius);font-size:13px;
  line-height:1.6;margin-bottom:16px;border:1px solid transparent;
}
.alert-icon{flex:0 0 16px;font-weight:700;line-height:1.5}
.alert--info{background:#ecf5ff;border-color:#d9ecff;color:#4a7bb5}
.alert--warning{background:#fdf6ec;border-color:#faecd8;color:#b88230}
.alert--success{background:#f0f9eb;border-color:#e1f3d8;color:#5d9c3f}
.alert--danger{background:#fef0f0;border-color:#fde2e2;color:#c45656}
.alert b{font-weight:600}

/* ---------- 描述列表 ---------- */
.desc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px 24px}
.desc-item{min-width:0}
.desc-label{font-size:12px;color:var(--text-3);margin-bottom:6px}
.desc-value{font-size:15px;color:var(--text-1);line-height:1.4;word-break:break-all}
.desc-value.is-num{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.desc-value.is-negative{color:var(--danger)}
.desc-value small{font-size:12px;font-weight:400;color:var(--text-3);margin-left:6px}

/* ---------- 账户摘要条 ----------
   四项并排一张卡，竖线分隔；不用四张独立统计卡——抽屉里四张卡占掉半屏，
   而这里每项只有「标签 / 数值 / 补充」三段，压扁后一行就够。 */
.stat-row{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px;
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 0;
}
.stat{padding:0 16px;border-left:1px solid var(--border-light);min-width:0}
.stat:first-child{border-left:0;padding-left:20px}
.stat:last-child{padding-right:20px}
.stat-label{font-size:12px;color:var(--text-3);margin-bottom:6px}
.stat-value{font-size:18px;font-weight:600;color:var(--text-1);font-variant-numeric:tabular-nums;line-height:1.25}
.stat-value.is-hero{font-size:24px;color:var(--primary)}
.stat-value.is-negative{color:var(--danger)}
.stat-foot{margin-top:6px;font-size:12px;color:var(--text-3);line-height:1.4}

/* ---------- 进度条 ---------- */
.progress{height:8px;border-radius:4px;background:#ebeef5;overflow:hidden;margin-top:12px}
.progress-bar{height:100%;border-radius:4px;background:var(--primary);transition:width .3s}
.progress-bar.is-complete{background:var(--success)}
.progress-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:8px}

/* ---------- 内联指标行 ----------
   周期卡原先是 2×2 描述列表，四个数占掉小半屏；标签和值并排一行就够。 */
.metric-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 36px}
.metric{display:flex;align-items:baseline;gap:8px;min-width:0}
.metric-label{font-size:12px;color:var(--text-3);white-space:nowrap}
.metric-value{font-size:14px;color:var(--text-1);font-variant-numeric:tabular-nums;line-height:1.4}
.metric-value.is-strong{font-size:18px;font-weight:600}
.metric-value.is-danger{color:var(--danger)}
.metric-value .unit{font-size:12px;font-weight:400;color:var(--text-3);margin-left:4px}

/* ---------- 抽屉 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;
  display:none;animation:fadeIn .2s ease;
}
.mask.is-open{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes popIn{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}

.drawer{
  position:fixed;top:0;right:0;bottom:0;width:560px;max-width:92vw;background:#fff;z-index:1001;
  display:none;flex-direction:column;box-shadow:-2px 0 12px rgba(0,0,0,.08);
}
.drawer.is-open{display:flex;animation:slideIn .24s ease}
.drawer-head{
  height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--border-light);
}
.drawer-title{font-size:16px;font-weight:600}
.drawer-close{font-size:18px;color:var(--text-3);line-height:1;padding:4px}
.drawer-close:hover{color:var(--primary)}
.drawer-body{flex:1;overflow-y:auto;background:var(--bg-th);padding:16px}
.drawer-foot{
  flex:0 0 60px;display:flex;align-items:center;justify-content:flex-end;gap:12px;
  padding:0 20px;border-top:1px solid var(--border-light);background:#fff;
}

/* ---------- 弹窗 ---------- */
.modal{
  position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:640px;max-width:92vw;
  background:#fff;border-radius:var(--radius);z-index:1001;display:none;
  box-shadow:var(--shadow-modal);flex-direction:column;max-height:74vh;
}
.modal.is-open{display:flex;animation:popIn .2s ease}
.modal--sm{width:520px}
.modal--md{width:680px}
/* 客服专员的两档转化线索在**同一行内**并排：档位名做成输入框前缀，
   这样一行仍是一个数字员工，行高与其他计价项保持一致（32px） */
.input-group{
  display:inline-flex;align-items:stretch;height:32px;overflow:hidden;
  border:1px solid var(--border);border-radius:var(--radius);background:#fff;transition:border-color .2s;
}
.input-group:hover{border-color:var(--text-4)}
.input-group:focus-within{border-color:var(--primary)}
.input-group__addon{
  display:flex;align-items:center;padding:0 8px;background:var(--bg-th);
  border-right:1px solid var(--border);color:var(--text-2);font-size:12px;white-space:nowrap;
}
.input-group .input{border:none;border-radius:0;height:100%;width:60px;padding:0 8px;background:transparent}
.input-group .input:hover,.input-group .input:focus{border-color:transparent}
.modal--lg{width:820px}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 14px;
}
.modal-title{font-size:17px;font-weight:600}
.modal-close{font-size:18px;color:var(--text-3);line-height:1;padding:4px}
.modal-close:hover{color:var(--primary)}
.modal-body{padding:0 20px 8px;overflow-y:auto;flex:1}
.modal-foot{display:flex;justify-content:flex-end;gap:12px;padding:16px 20px 20px}

/* ---------- 弹窗内的表单分组 ---------- */
.form-block{background:var(--bg-th);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
/* 抽屉/弹窗内直接铺在灰底上，避免与容器同色糊成一片 */
.drawer-body .form-block{background:transparent;border-radius:0;padding:14px 0;margin-bottom:0;border-bottom:1px solid var(--border-light)}
.drawer-body .form-block:last-of-type{border-bottom:none}
.modal-body .form-block{background:transparent;padding:0;margin-bottom:0}
.modal-body .form-block .block-title{margin-top:4px}
.form-block:last-child{margin-bottom:0}
/* 弹窗内分组自身 margin 归零，相邻分组之间补回间距 */
.modal-body .form-block + .form-block{margin-top:18px}

/* 两行表头：客服专员跨两列（自然 / AI 两档转化线索），子表头居中且弱化 */
.table th.th-group{text-align:center}
.table th.th-group small{display:block;font-weight:400;font-size:12px;color:var(--text-4);margin-top:2px}
.table th.th-sub{text-align:center;font-weight:400;font-size:13px;padding-top:8px;padding-bottom:8px}
/* 表格里的两档：数字在上、档位名在下，左右并排，一行仍是一个岗位 */
.tier-pair{display:inline-flex;gap:16px;vertical-align:middle}
.tier-pair > span{display:inline-flex;flex-direction:column;gap:2px;line-height:1.25}
.tier-pair b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text-1)}
.tier-pair small{font-size:12px;color:var(--text-3);white-space:nowrap}

/* ---------- 抽屉 / 弹窗尺寸变体 ----------
   表格型配置用宽抽屉，账本型明细用宽弹窗；560px 塞不下多列表格 */
.drawer--wide{width:920px}
.modal--xl{width:1080px;max-height:82vh}   /* 账本型明细更长，别让末行被 74vh 切掉 */
/* 抽屉背景是浅灰，摘要条自带白底，别再叠一层内边距 */
.drawer-body .stat-row{margin-top:0}
.drawer-body .desc-grid{grid-template-columns:repeat(2,1fr);gap:14px 20px}
.drawer-body .card:last-child{margin-bottom:0}
.drawer-foot .foot-note{margin-right:auto;font-size:12px;color:var(--text-3)}
.modal-body .table-wrap{border:1px solid var(--border-light);border-radius:var(--radius)}
.form-block-title{font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:14px}
.form-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.form-row:last-child{margin-bottom:0}
.form-row > .field-label{flex:0 0 108px;text-align:right;justify-content:flex-end}

.form-row--top{align-items:flex-start}
.form-row--top > .field-label{padding-top:6px}
.form-static{color:var(--text-1);font-size:14px}

.inline-note{font-size:12px;color:var(--text-3);white-space:nowrap}

/* ---------- 开关 ---------- */
.switch{
  position:relative;display:inline-flex;width:40px;height:20px;flex:0 0 40px;
  border-radius:10px;background:#dcdfe6;transition:background .3s;cursor:pointer;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .3s;box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.switch.is-on{background:var(--primary)}
.switch.is-on::after{transform:translateX(20px)}
.switch.is-disabled{opacity:.5;cursor:not-allowed}

/* ---------- 单选组（付费状态 / 充值类型） ----------
   卡片式单选而非原生圆点：VIP 编辑里这两组是「选一个再填数字」的开关，
   卡片可以把选项文字放大到 13px，比原生 12px 圆点好认 */
.radio-group{display:flex;flex-wrap:wrap;gap:8px}
.radio{
  display:inline-flex;align-items:center;height:32px;padding:0 12px;
  border:1px solid var(--border);border-radius:var(--radius);background:#fff;
  font-size:13px;color:var(--text-2);cursor:pointer;transition:border-color .2s,color .2s,background .2s;
}
.radio:hover{border-color:var(--text-4)}
/* 真 input 留在 DOM 里承载选中态，只是不画出来——圆点在 12px 下辨识度太低 */
.radio input{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
.radio.is-on{border-color:var(--primary);color:var(--primary);background:var(--bg-active)}
.radio:focus-within{box-shadow:0 0 0 2px rgba(64,158,255,.2)}

/* ---------- 预览块 ---------- */
.preview{
  background:var(--border-lighter);border-radius:var(--radius);padding:14px 16px;font-size:13px;
  color:var(--text-2);line-height:1.9;
}
.preview b{color:var(--text-1);font-weight:600;font-variant-numeric:tabular-nums}
.preview .is-negative{color:var(--danger)}

/* ---------- Toast ---------- */
.toast-root{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{
  display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius);
  background:#f0f9eb;border:1px solid #e1f3d8;color:#5d9c3f;font-size:14px;
  box-shadow:var(--shadow);animation:popIn .2s ease;
}
.toast--error{background:#fef0f0;border-color:#fde2e2;color:#c45656}

/* ---------- 空态 ---------- */
.empty{padding:48px 0;text-align:center;color:var(--text-3);font-size:13px}

/* ---------- 页签 ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-light);padding:0 20px;background:#fff;border-radius:var(--radius) var(--radius) 0 0}
.tab{
  padding:14px 18px;font-size:14px;color:var(--text-2);cursor:pointer;position:relative;
  border-bottom:2px solid transparent;margin-bottom:-1px;

.tab:hover{color:var(--primary)}
.tab.is-active{color:var(--primary);font-weight:500;border-bottom-color:var(--primary)}
.tab-badge{
  display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;

.tab.is-active .tab-badge{background:var(--primary);color:#fff}

/* ---------- 两栏 ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.kv-list{font-size:13px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed var(--border-light)}
.kv:last-child{border-bottom:none}
.kv-k{color:var(--text-3);flex:0 0 auto}
.kv-v{color:var(--text-1);text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}

function pushFee(store, row) {
  const [time, position, account, object, customer, contact, leadAt, city, model, budget, intent,
    remark, mode, leadType] = row;
  fees.push({
    store: store.name, storeId: store.id, industry: store.industry,

/* ---------- 取价与快照 ---------- */
// 门店生效套餐：计费起点是所属行业的默认套餐（必然存在），
// 门店恒关联一个套餐包（§2.5），生效套餐就是本店关联套餐。
// 回落到行业默认套餐只是数据异常时的防御：即便走到那一步，
// 行业默认套餐也必然存在，所以链路上不会出现"没有生效套餐"的账户。
function effectivePackage(store) {
  return packageById(store.packageId) || packageById(industryDefault[store.industry]) || null;
}
// 基础结算：取生效套餐的计价项单价（§2.2）。六个计价项单价都是套餐的必配项，
// 不存在"该计价项未配置"；LIST_PRICE 分支是数据异常时的兜底，正常取不到。
// 客服专员还要看转化类型——自然与 AI 两档在套餐里是两个独立的格子（§3.4）。
// 套餐是整包的，且门店恒有关联，所以本店生效单价恒取本店关联套餐
function basePriceOf(store, position, leadType) {
  const own = packageById(store.packageId);
  const pkg = own || packageById(industryDefault[store.industry]);
  const key = priceKeyOf(position, leadType);
  if (pkg && pkg.prices[key] != null) {
    return { price: pkg.prices[key], source: own ? '门店关联套餐' : '行业默认套餐' };
  }
  return { price: LIST_PRICE[position], source: '刊例价兜底' };   // 数据异常兜底，正常不应出现
}
// 高级结算：单价由原有获客结算配置决定，取价来源记为「高级结算配置」
function seniorPriceOf(account, position, object) {
  if (!account.senior) return null;
  const tier = position === '副号获客专家' ? '收购-精准线索' : tierOfObject(object);
  const p = account.senior.prices[tier];
  return { price: p == null ? 50 : p, source: '高级结算配置', tier: tier };
}
// 按线索标识稳定派生分档，保证同一线索在各视图读数一致
function tierOfObject(object) {
  let h = 0;
  for (let i = 0; i < object.length; i++) h = (h * 31 + object.charCodeAt(i)) >>> 0;
  return SENIOR_TIERS[h % 3];
}
// 单条费用记录的单价快照：先判账号是否已开启高级结算，再回落基础结算链路
// 已入账的记录直接返回定格快照，配置变更不影响历史
function priceOfFee(fee) {
  if (fee.snap) return fee.snap;
  const store = stores.find(s => s.id === fee.storeId);
  if (fee.isMinimum) return { price: 0, source: '—', settlement: '—' };
  const account = (platformAccounts[fee.storeId] || []).find(a => a.name === fee.account);
  if (account && account.settlement === 'advanced' && account.senior) {
    const sp = seniorPriceOf(account, fee.position, fee.object);
    return { price: sp.price, source: sp.source, settlement: '高级结算' };
  }
  const bp = basePriceOf(store, fee.position, fee.leadType);
  return { price: bp.price, source: bp.source, settlement: '基础结算' };
}

/* ---------- 服务期 / 低消周期计算 ---------- */
function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  // 这里必须按本地年月日拼串：解析用的是本地时区（T00:00:00），
  // toISOString() 却输出 UTC，UTC+8 下每次加天数都会少一天（+90 变成 89）。
  const p = v => String(v).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function serviceRemainDays(store) {
  return daysBetween(TODAY, store.expiresAt.slice(0, 10));
}
function cycleRemainDays(store) {
  return daysBetween(TODAY, store.cycleEndAt);
}
// 月最低消耗随生效套餐走，与单价同一条链路（§4.2）：门店恒有关联套餐，
// 所以每个账户都有月最低消耗，不存在不设低消的账户。
// 末尾的 || 0 只是防御：按规则取不到 null。
function monthlyMinimumOf(store) {
  const pkg = effectivePackage(store);
  return pkg ? pkg.monthlyMinimum : 0;
}
function cycleConsumedOf(store) {
  return store.cycleConsumed;
}

/* ---------- 账本推导 ----------
   余额、周期消耗、补扣金额一律由流水推出，不手填——否则「可用电力值 ≡
   到账合计 − 扣减合计」这条恒等式会在数据变动中悄悄破掉。 */
// 周期内业务消耗：不含周期末补扣（补差是找齐，不是消耗，§4.2）
function cycleFeesOf(store) {
  return fees.filter(f => f.storeId === store.id && !f.isMinimum &&
    f.time.slice(0, 10) >= store.cycleStartAt && f.time.slice(0, 10) <= store.cycleEndAt);
}
function sumPower(list) {
  return list.reduce((a, f) => a + priceOfFee(f).price, 0);
}
// 周期已结束、且服务期仍在的门店，在周期末日 23:59:59（等价于到账日 + 32 天的 00:00）
// 落一条补差记录（§4.1 / §4.2）
stores.forEach(s => {
  if (cycleRemainDays(s) > 0 || serviceRemainDays(s) <= 0) return;
  const gap = monthlyMinimumOf(s) - sumPower(cycleFeesOf(s));
  if (gap <= 0) return;
  fees.push({
    store: s.name, storeId: s.id, industry: s.industry,
    time: s.cycleEndAt + ' 23:59:59', position: '', account: '', object: '',
    customer: '', contact: '', leadAt: '', city: '', model: '', budget: '', intent: '',
    remark: '31天最低消耗补扣', advanced: false, isMinimum: true, power: gap,
    snap: { price: 0, source: '—', settlement: '—' }
  });
});
// 按时间重放账本：充值前/后可用电力值、账户可用电力值均由重放得出
stores.forEach(s => {
  const events = [];
  (recharges[s.id] || []).forEach(r => events.push({ t: r.arrivedAt, inbound: r }));
  fees.filter(f => f.storeId === s.id).forEach(f => events.push({ t: f.time, fee: f }));
  events.sort((a, b) => a.t === b.t ? (a.fee ? -1 : 1) : (a.t < b.t ? -1 : 1));
  let bal = 0;
  events.forEach(e => {
    if (e.inbound) { e.inbound.before = bal; bal += e.inbound.amount; e.inbound.after = bal; }
    else { bal -= e.fee.isMinimum ? e.fee.power : priceOfFee(e.fee).price; }
  });
  s.balance = bal;
  s.cycleConsumed = sumPower(cycleFeesOf(s));
  s.frozenPower = s.status === 'frozen' ? bal : 0;
});

// 车型库均由门店行的「···」菜单以抽屉或弹窗承载，不产生路由（见 STORE_MENU）
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [route, a] = raw.split('/');
  if (route === 'store-detail' && a) {
    state.route = route; state.storeId = a;
  } else if (route === 'packages' || route === 'store-list') {
    state.route = route;
  } else {
    // 无效或已下线的地址（如旧的 #/store-l2/s1）回落列表，并把地址栏一起纠回来，
    // 免得页面显示列表、URL 却停留在打不开的路径上。raw 为空是首次进入、
    // 由启动段补默认地址，这里不要抢先写 hash，否则会多触发一次 hashchange。
    state.route = 'store-list';
    if (raw && location.hash !== '#/store-list') location.hash = '#/store-list';
  }
}

/* ---------- 分页 ---------- */
function pager(total, page, perPage, onAttr, resizable) {
  const pages = Math.max(1, Math.ceil(total / perPage));
  let btns = '';
  for (let i = 1; i <= pages; i++) {
    btns += '<button class="pager-btn' + (i === page ? ' is-active' : '') + '" ' + onAttr + '="' + i + '">' + i + '</button>';
  }
  const sizeOpts = [10, 20, 50].map(n =>
    '<option value="' + n + '"' + (n === perPage ? ' selected' : '') + '>' + n + ' 条/页</option>').join('');
  return '<div class="pager">' +
    '<span class="pager-total">共 ' + pages + ' 页/' + total + ' 条数据</span>' +
    '<button class="pager-btn" ' + onAttr + '="' + Math.max(1, page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>‹</button>' +
    btns +
    '<button class="pager-btn" ' + onAttr + '="' + Math.min(pages, page + 1) + '"' + (page >= pages ? ' disabled' : '') + '>›</button>' +
    (resizable
      ? '<select class="select input--sm" style="height:28px" data-pagesize="' + onAttr + '">' + sizeOpts + '</select>'
      : '<select class="select input--sm" style="height:28px" disabled>' + sizeOpts + '</select>') +
    '</div>';
}

  // 一行一个岗位；客服专员的两档单价在同一格里并排，本店按哪一档计费一目了然
  const rows = POSITIONS.map(pos => {
    const tiers = pos === '客服专员' ? LEAD_TYPES : [null];
    const priced = tiers.map(lt => basePriceOf(s, pos, lt));
    const cell = tiers.length === 1
      ? '<td class="cell-num">' + priced[0].price + '</td>'
      : '<td class="cell-num"><span class="tier-pair">' + priced.map((x, i) =>
          '<span><b>' + x.price + '</b><small>' + esc(tiers[i]) + '</small></span>').join('') + '</span></td>';
    // 抖音触达专员按「岗位名在上、单位在下」展示（§7.4）：本岗位单价按有效触达计，
    // 单位与其它岗位不同，跟着岗位名走，避免被读成每条的单价
    const nameCell = pos === '抖音触达专员'
      ? '<td class="cell-strong nw">' + esc(pos) + '<div class="cell-sub">' + esc(LIST_PRICE_UNIT[pos]) + '</div></td>'
      : '<td class="cell-strong nw">' + esc(pos) + '</td>';
    return '<tr>' +
      nameCell +
      cell +
      '</tr>';
  }).join('');

  return '<div class="card card--flush" style="margin-bottom:0">' +
    '<div class="card-head">' +
    '<div class="card-title">关联套餐<small>' + esc(s.name) + ' · ' + esc(s.industry) + '</small></div>' +
    '</div>' +
    '<div class="card-body">' +
    '<select class="select select--block" id="pkgSelect">' + opts + '</select>' +
    '</div></div>' +

    '<div class="card card--flush" style="margin:14px 0 0">' +
    '<div class="card-head"><div class="card-title">本店生效单价</div></div>' +
    '<div class="card-body" style="padding-top:0">' +
    '<div class="table-wrap"><table class="table"><thead><tr>' +
    '<th>岗位</th><th>生效单价（电力值）</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</div></div>';
}

/* ---- 侧边栏：电力账户（§9.1 / §9.2）—— 门店行「···」菜单打开，不跳转 ---- */
function openAccountDrawer(storeId) {
  const s = stores.find(x => x.id === storeId) || currentStore();
  openDrawer('电力账户', accountBody(s),
    '<button class="btn btn--primary" data-action="open-vip" data-id="' + s.id + '">VIP 编辑</button>',
    'drawer--wide');
}
function accountBody(s) {
  const frozen = s.status === 'frozen';
  const svcDays = serviceRemainDays(s);
  const cycDays = cycleRemainDays(s);
  const minimum = monthlyMinimumOf(s);
  const consumed = cycleConsumedOf(s);
  // 行业默认套餐必然存在，每个账户都有低消；|| 只是防御，进度条不做除零
  const pct = minimum > 0 ? Math.min(100, Math.round(consumed / minimum * 100)) : 0;
  const effPkg = effectivePackage(s);

  const svcFoot = frozen
    ? '<div class="stat-foot text-danger">服务期已到期，账户已冻结</div>'
    : (svcDays <= 7
      ? '<div class="stat-foot text-danger">距到期仅剩 ' + svcDays + ' 天</div>'
      : '<div class="stat-foot">剩余 ' + svcDays + ' 天</div>');

  const cycleCard = frozen
    ? '<div class="card"><div class="card-title" style="margin-bottom:12px">月度最低消耗周期</div>' +
      '<div class="alert alert--danger" style="margin:0"><span class="alert-icon">!</span><span>' +
      '账户已冻结，低消周期暂停。</span></div></div>'
    : '<div class="card">' +
      '<div class="card-title" style="margin-bottom:12px">月度最低消耗周期</div>' +
      '<div class="metric-row">' +
      metricItem('本周期', s.cycleStartAt + ' ~ ' + s.cycleEndAt) +
      // 周期已过结束时点但尚未结转：直接写天数会出现「剩余 -2 天」
      metricItem('剩余天数', cycDays >= 0 ? cycDays + ' 天' : '已结束 ' + (-cycDays) + ' 天，待结转',
        cycDays >= 0 ? '' : 'is-danger') +
      // 标出生效套餐，否则看不出这个数是哪来的
      metricItem('月最低消耗', num(minimum) + '<span class="unit">电力值' +
        (effPkg ? ' · ' + esc(effPkg.name) : '') + '</span>', 'is-strong') +
      '</div>' +
      '<div class="progress"><div class="progress-bar' + (pct >= 100 ? ' is-complete' : '') + '" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-legend"><span>本周期已消耗 <b class="mono" style="color:#303133">' + num(consumed) + '</b> 电力值</span>' +
      '<span>已完成 ' + pct + '%</span></div></div>';

  const allRc = recharges[s.id] || [];
  const rcRows = allRc.slice().reverse().map(r => {
    // 备注里的抵扣额带千分位（num()），正则要连逗号一起收，否则 ≥1000 时高亮丢失
    const deduct = /抵扣([\d,]+)电力值/.exec(r.remark);
    return '<tr>' +
      '<td class="mono">' + esc(r.id) + '</td>' +
      // VIP 调整可以为负，此时不能再硬拼「+」，颜色也要跟着翻
      '<td class="cell-num cell-strong ' + (r.amount < 0 ? 'text-danger' : 'text-success') + '">' + signed(r.amount) + '</td>' +
      // 充值类型是本笔入账的性质；负数调整不是充值，数据侧记的是「—」
      '<td><span class="tag ' + (RECHARGE_TYPE_TAG[r.type] || 'tag--plain') + '">' + esc(r.type || '—') + '</span></td>' +
      // 充值前/后合成一格、到账/登记也合成一格：抽屉只有 920px，
      // 拆成八列会把备注挤成一字一行
      '<td class="cell-num" title="充值前 ' + num(r.before) + ' → 充值后 ' + num(r.after) + '">' +
      '<span' + (r.before < 0 ? ' class="text-danger"' : '') + '>' + num(r.before) + '</span>' +
      ' <span class="text-3">→</span> ' + num(r.after) + '</td>' +
      // 两个时间都去掉秒，完整值放 title 里
      '<td class="cell-num" title="到账 ' + esc(r.arrivedAt) + ' · 登记 ' + esc(r.loggedAt) + '">' +
      esc(r.arrivedAt.slice(0, 16)) +
      '<div class="field-hint">登记 ' + esc(r.loggedAt.slice(0, 16)) + '</div></td>' +
      '<td>' + esc(r.operator) + '</td>' +
      '<td>' + (deduct ? '补充电力值，抵扣 <b class="text-danger">' + num(deduct[1].replace(/,/g, '')) + '</b> 电力值' : esc(r.remark)) + '</td>' +
      '</tr>';
  }).join('');

  const lastRc = (recharges[s.id] || []).slice(-1)[0];

  return '<div class="stat-row">' +
    '<div class="stat"><div class="stat-label">可用电力值</div>' +
    '<div class="stat-value is-hero' + (s.balance < 0 ? ' is-negative' : '') + '">' + num(s.balance) + '</div>' +
    '<div class="stat-foot">' + (s.balance < 0 ? '账户已透支'
      : (lastRc ? '最近到账 ' + esc(lastRc.arrivedAt.slice(0, 10)) : '暂无充值记录')) + '</div></div>' +

    '<div class="stat"><div class="stat-label">冻结电力值</div>' +
    '<div class="stat-value">' + num(s.frozenPower) + '</div>' +
    '<div class="stat-foot">' + (frozen ? '服务期到期后冻结' : '无') + '</div></div>' +

    '<div class="stat"><div class="stat-label">服务期截止日</div>' +
    '<div class="stat-value">' + esc(s.expiresAt.slice(0, 10)) + '</div>' +
    svcFoot + '</div>' +

    '<div class="stat"><div class="stat-label">账户状态</div>' +
    '<div class="stat-value">' + (frozen ? '<span class="text-danger">已冻结</span>' : '<span class="text-success">正常</span>') +
    // 付费状态在 VIP 编辑里可切，跟账户状态并排摆出来，免得要开弹窗才看得到
    '<span class="tag ' + (s.payStatus === '付费' ? 'tag--success' : 'tag--info') +
    '" style="margin-left:8px;vertical-align:3px">' + esc(s.payStatus) + '</span></div>' +
    '<div class="stat-foot">首次充值到账日 ' + esc(s.firstRechargeAt.slice(0, 10)) + '</div></div>' +
    '</div>' +

    cycleCard +

    '<div class="card card--flush">' +
    '<div class="card-head"><div class="card-title">充值记录<small>共 ' + allRc.length + ' 笔</small></div>' +
    '<span class="link" data-action="export-recharge" data-id="' + s.id + '">导出</span></div>' +
    '<div class="card-body" style="padding-top:0"><div class="table-wrap"><table class="table"><thead><tr>' +
    '<th>记录标识</th><th>到账电力值</th><th>充值类型</th><th>可用电力值</th>' +
    '<th>到账 / 登记时间</th><th>操作人</th><th>备注</th>' +
    '</tr></thead><tbody>' +
    (rcRows || '<tr><td colspan="7"><div class="empty">暂无充值记录</div></td></tr>') +
    '</tbody></table></div></div></div>';
}

function descItem(label, value, cls) {
  return '<div class="desc-item"><div class="desc-label">' + esc(label) + '</div>' +
    '<div class="desc-value ' + (cls || '') + '">' + (cls === 'is-num' ? value : esc(value)) + '</div></div>';
}
/* 一行内联指标：标签和值并排，不再各占一行 */
function metricItem(label, value, cls) {
  return '<div class="metric"><span class="metric-label">' + esc(label) + '</span>' +
    '<span class="metric-value ' + (cls || '') + '">' + (cls === 'is-strong' ? value : esc(value)) + '</span></div>';
}

/* ---------- 页面 3：套餐包管理（§9.3） ---------- */
// 引用情况：是不是所属行业的默认套餐、被哪些门店关联——列表展示、删除保护与
// 「所属行业」不可改的拦截读同一个函数，避免几处判断走散
function usageOf(pkg) {
  return {
    isDefault: industryDefault[pkg.industry] === pkg.id,
    stores: stores.filter(s => s.packageId === pkg.id)
  };
}
// 引用情况的文字陈述，如「是「二手车」行业的默认套餐」「已关联 3 家门店」
function usageReasons(pkg) {
  const u = usageOf(pkg);
  const parts = [];
  if (u.isDefault) parts.push('是「' + pkg.industry + '」行业的默认套餐');
  if (u.stores.length) parts.push('已关联 ' + u.stores.length + ' 家门店');
  return parts;
}

function renderPackages() {
  const rows = packages.map(p => {
    const u = usageOf(p);
    return '<tr>' +
      '<td class="cell-strong nw">' + esc(p.name) + '</td>' +
      '<td class="cell-note">' + (p.note ? esc(p.note) : '<span class="text-3">—</span>') + '</td>' +
      PRICE_KEYS.map(k => '<td class="cell-num">' + p.prices[k] + '</td>').join('') +
      '<td class="cell-num">' + num(p.monthlyMinimum) + '</td>' +
      '<td class="nw">' + esc(p.industry) + '</td>' +
      '<td>' + (u.isDefault
        ? '<span class="tag tag--primary">默认套餐</span>'
        : '<span class="text-3">—</span>') + '</td>' +
      '<td class="col-op">' +
      (u.isDefault
        ? '<span class="link is-disabled">设为默认</span>'
        : '<span class="link" data-pkg-default="' + p.id + '">设为默认</span>') +
      '<span class="link" data-pkg-edit="' + p.id + '">编辑</span>' +
      '<span class="link link--danger" data-pkg-del="' + p.id + '">删除</span>' +
      '</td></tr>';
  }).join('');

  return '<div class="card card--flush">' +
    '<div class="card-head"><div class="card-title">套餐包列表</div>' +
    '<div class="card-actions"><button class="btn btn--primary" data-action="pkg-add">新增套餐包</button></div></div>' +
    '<div class="card-body" style="padding-top:0">' +
    '<div class="table-wrap"><table class="table"><thead><tr>' +
    '<th rowspan="2">套餐名称</th><th rowspan="2">备注</th>' +
    '<th rowspan="2">' + esc(POSITIONS[0]) + '</th>' +
    '<th rowspan="2">' + esc(POSITIONS[1]) + '</th>' +
    '<th rowspan="2">' + esc(POSITIONS[2]) + '</th>' +
    '<th colspan="2" class="th-group">' + esc(POSITIONS[3]) + '</th>' +
    '<th rowspan="2">' + esc(POSITIONS[4]) + '</th>' +
    '<th rowspan="2">月最低消耗</th><th rowspan="2">所属行业</th><th rowspan="2">行业默认</th>' +
    '<th rowspan="2" class="col-op">操作</th>' +
    '</tr><tr>' + LEAD_TYPES.map(lt => '<th class="th-sub">' + esc(lt) + '</th>').join('') + '</tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="12"><div class="empty">暂无数据</div></td></tr>') + '</tbody></table></div>' +
    '</div></div>';
}

/* ---------- 抽屉 / 弹窗基础设施 ---------- */
function openDrawer(title, body, foot, size) {
  $('#modalRoot').innerHTML = '';   // 抽屉与弹窗互斥，避免叠成两层
  $('#drawerRoot').innerHTML =
    '<div class="drawer is-open ' + (size || '') + '"><div class="drawer-head">' +
    '<div class="drawer-title">' + esc(title) + '</div>' +
    '<button class="drawer-close" data-close="1">✕</button></div>' +
    '<div class="drawer-body">' + body + '</div>' +
    '<div class="drawer-foot">' + foot + '</div></div>';
  $('#mask').classList.add('is-open');
}
function openModal(title, body, foot, size) {
  $('#drawerRoot').innerHTML = '';  // 同上
  $('#modalRoot').innerHTML =
    '<div class="modal is-open ' + (size || '') + '"><div class="modal-head">' +
    '<div class="modal-title">' + esc(title) + '</div>' +
    '<button class="modal-close" data-close="1">✕</button></div>' +
    '<div class="modal-body">' + body + '</div>' +
    '<div class="modal-foot">' + foot + '</div></div>';
  $('#mask').classList.add('is-open');
}
function closeOverlay() {
  closeRowMenu();
  $('#drawerRoot').innerHTML = '';
  $('#modalRoot').innerHTML = '';
  $('#mask').classList.remove('is-open');
}

function formRow(label, control, required, extraCls) {
  return '<div class="form-row ' + (extraCls || '') + '">' +
    '<span class="field-label' + (required ? ' is-required' : '') + '">' + esc(label) + '</span>' +
    '<span class="form-control">' + control + '</span></div>';
}
/* 卡片式单选组：真 input 承载选中态（保存时读 :checked），.is-on 只管样式 */
function radioGroup(name, options, checked) {
  return '<div class="radio-group" data-radio-group="' + esc(name) + '">' +
    options.map(o =>
      '<label class="radio' + (o === checked ? ' is-on' : '') + '">' +
      '<input type="radio" name="' + esc(name) + '" value="' + esc(o) + '"' + (o === checked ? ' checked' : '') + '>' +
      '<span>' + esc(o) + '</span></label>').join('') +
    '</div>';
}
function radioValue(name) {
  const el = document.querySelector('input[name="' + name + '"]:checked');
  return el ? el.value : '';
}

    formRow('周边城市', '<input class="input input--block" placeholder="请选择省/市" value="' + esc((cfg.rules.cities || []).join('、')) + '"' + (on ? '' : ' disabled') + '>') +
    formRow('热卖车型', '<input class="input input--block" placeholder="请选择热卖车型" value="' + esc(cfg.rules.models || '') + '"' + (on ? '' : ' disabled') + '>') +

    '<div class="form-block-title">触达规则配置</div>' +
    formRow('可触达品牌/车系', '<span class="switch' + (cfg.rules.brandEnabled ? ' is-on' : '') + '" data-senior-brand="1"></span>', false, 'form-row--top') +

  openDrawer('获客专家配置', body,

  const body =
    formRow('当前到期时间', '<span class="form-static is-num">' + esc(s.expiresAt) + '</span>') +

    formRow('付费状态', radioGroup('vipStatus', VIP_PAY_STATUS, s.payStatus)) +
    formRow('充值类型', radioGroup('vipType', VIP_RECHARGE_TYPES, '付费充值')) +
    formRow('到期天数调整', '<input class="input input--block" id="vipDays" placeholder="正数增加，负数减少">') +
    formRow('电力值调整', '<input class="input input--block" id="vipPower" placeholder="正数增加，负数减少">') +
    formRow('员工消耗套餐包', '<span class="form-static">' + esc(ownPkg ? ownPkg.name : '—') + '</span>') +
    '<div class="preview" style="margin-top:6px">' +
    '预计到期时间：<b id="vipPreviewDate">' + esc(s.expiresAt) + '</b>' +
    '<div class="field-hint" id="vipDateHint"></div>' +
    '预计剩余电力值：<b id="vipPreviewPower">' + num(s.balance) + '</b>' +
    '预计低消周期起始日：<b id="vipPreviewCycle">' + esc(s.cycleStartAt) + '</b>' +
    '预计月最低消耗：<b>' + num(monthlyMinimumOf(s)) + ' 电力值</b>' +

  openModal('VIP编辑', body,

    '<button class="btn btn--primary" data-action="vip-save" data-id="' + s.id + '">保存</button>', 'modal--md');

  const daysInput = $('#vipDays');
  const powerInput = $('#vipPower');
  // 365 是不是系统替运营填的：只有自动填进去的才允许被自动收回，运营手改过的不覆盖
  let autoFilled = false;
  // 本次动作的性质由「充值类型」决定：三类续约型 → 顺延服务期 + 重置低消周期，
  // 「赠送」只入账、两条都不触发。唯一被排除在充值之外的是负数的电力值调整——那是扣减
  const isDeduction = () => (parseInt(powerInput.value, 10) || 0) < 0;
  const renews = () => !isDeduction() && !!RECHARGE_RENEWS[radioValue('vipType')];
  // 基准日：切换了付费状态按「当日」重算，未切换才在原到期时间上顺延（§9.1）
  const switched = () => radioValue('vipStatus') !== s.payStatus;
  const baseDate = () => switched() ? TODAY : s.expiresAt.slice(0, 10);

  const upd = () => {
    const d = parseInt(daysInput.value, 10) || 0;
    const p = parseInt(powerInput.value, 10) || 0;
    $('#vipPreviewDate').textContent = d ? addDays(baseDate(), d) + ' 23:59:59' : s.expiresAt;
    $('#vipDateHint').textContent = !d
      ? '服务期不变'
      : (switched()
        ? '按当日 ' + TODAY + ' 顺延 ' + d + ' 天'
        : '按当前到期时间 ' + s.expiresAt.slice(0, 10) + ' 顺延 ' + d + ' 天');
    $('#vipPreviewPower').textContent = num(s.balance + p);
    // 低消周期直接出日期，不写「是否重置」的规则说明；起算日是到账日的次日（§4.1）
    $('#vipPreviewCycle').textContent = renews() ? addDays(TODAY, 1) : s.cycleStartAt;
  };
  // 充值类型 → 「到期天数调整」自动填 365。填进去的才允许被自动收回，
  // 运营手改过的不覆盖；换成「赠送」或改成负数扣减时把自动值收回
  const syncDays = () => {
    if (renews()) {
      if (daysInput.value === '' || autoFilled) { daysInput.value = String(VIP_SERVICE_DAYS); autoFilled = true; }
    } else if (autoFilled) {
      daysInput.value = ''; autoFilled = false;
    }
  };
  // 只重画样式：选中态由真 input 承载，保存时读 :checked
  const paint = () => $$('#modalRoot .radio').forEach(l =>
    l.classList.toggle('is-on', l.querySelector('input').checked));

  $$('#modalRoot .radio input').forEach(inp => inp.addEventListener('change', () => { paint(); syncDays(); upd(); }));
  daysInput.addEventListener('input', () => { autoFilled = false; upd(); });
  powerInput.addEventListener('input', () => { syncDays(); upd(); });
  // 默认的「付费充值」本身就是一次续约，所以弹窗一开就带上 365
  syncDays();
  upd();
}

/* ---------- 弹窗：新建 / 编辑套餐包 ---------- */
function openPkgEdit(pkgId) {
  const pkg = packageById(pkgId);
  const reasons = pkg ? usageReasons(pkg) : [];

  // 所属行业是套餐的固有属性、必填（§9.3）。已经关联门店、或已经是本行业默认
  // 套餐的不允许改——改了会留下跨行业的门店关联，或把某行业置为没有默认套餐
  const indLocked = reasons.length > 0;
  const indField = '<select class="select" id="pkgIndustry"' + (indLocked ? ' disabled' : '') + '>' +
    '<option value="">请选择</option>' +
    INDUSTRIES.map(i => '<option value="' + esc(i) + '"' +
      (pkg && pkg.industry === i ? ' selected' : '') + '>' + esc(i) + '</option>').join('') +
    '</select>' +
    (indLocked ? '<span class="inline-note" style="white-space:normal">该套餐' + reasons.join('，') + '，不可修改</span>' : '');

  // 一行一个数字员工；客服专员的两档转化线索在同一行内并排，档位名做输入框前缀，
  // 因此套餐里是六个计价项，但表单里只有五行
  const priceRows = POSITIONS.map(pos => {
    const tiers = pos === '客服专员' ? LEAD_TYPES : [null];
    const controls = tiers.map(lt => {
      const key = priceKeyOf(pos, lt);
      const attrs = 'type="number" min="1" step="1" data-pkg-price="' + esc(key) + '" value="' +
        (pkg && pkg.prices[key] != null ? pkg.prices[key] : '') + '"';
      return lt
        ? '<span class="input-group"><span class="input-group__addon">' + esc(lt) + '</span>' +
          '<input class="input" ' + attrs + ' placeholder="必填"></span>'
        : '<input class="input input--sm" ' + attrs + ' placeholder="请输入">';
    }).join('');
    // 输入框旁给刊例价参照（§9.5 验收 8）。客服专员的刊例价不分档，整行只给一个 10
    return formRow(pos, controls + '<span class="inline-note">' + esc(listPriceHint(pos)) + '</span>');
  }).join('');

  const body =
    (reasons.length
      ? '<div class="alert alert--warning" style="margin-bottom:14px"><span class="alert-icon">!</span><span>' +
        '该套餐' + reasons.join('，') + '，保存后立即生效。</span></div>'
      : '') +
    formRow('套餐名称', '<input class="input input--block" id="pkgName" value="' + esc(pkg ? pkg.name : '') + '" placeholder="请输入套餐名称">', true) +
    formRow('所属行业', indField, true) +
    formRow('备注', '<input class="input input--block" id="pkgNote" value="' + esc(pkg ? pkg.note : '') + '" placeholder="选填">') +
    '<div class="form-block"><div class="form-block-title">岗位实际消耗单价</div>' +
    priceRows + '</div>' +
    '<div class="form-block"><div class="form-block-title">月最低消耗</div>' +
    formRow('数值', '<input class="input input--sm" type="number" min="1" step="1" id="pkgMin" value="' +
      (pkg ? pkg.monthlyMinimum : '') + '" placeholder="请输入"><span class="inline-note">电力值</span>', true) +
    '</div>';

  openModal(pkg ? '编辑套餐包' : '新增套餐包', body,
    '<button class="btn" data-close="1">取消</button>' +
    '<button class="btn btn--primary" data-action="pkg-save" data-id="' + (pkg ? pkg.id : '') + '">保存</button>',
    'modal--md');
}

/* ---------- 弹窗：删除套餐包（行业默认套餐、或有关联门店的不可删） ---------- */
function openPkgDelete(pkgId) {
  const pkg = packageById(pkgId);
  if (!pkg) return;
  const u = usageOf(pkg);
  const reasons = usageReasons(pkg);

  const body = reasons.length
    ? '<div class="alert alert--warning" style="margin:0"><span class="alert-icon">!</span><span>' +
      '「' + esc(pkg.name) + '」' + reasons.join('，') + '，不可删除。' +
      (u.isDefault
        ? '如需删除，请先把「' + esc(pkg.industry) + '」行业的默认套餐改选为其他套餐' +
          (u.stores.length ? '，并解除与门店的关联。' : '。')
        : '如需删除，请先解除与门店的关联。') + '</span></div>'
    : '<div class="field-hint" style="font-size:13px">确定删除「' + esc(pkg.name) + '」？删除后不可恢复。</div>';

  openModal('删除套餐包', body,
    '<button class="btn" data-close="1">取消</button>' +
    (reasons.length ? '' : '<button class="btn btn--danger" data-action="pkg-del-confirm" data-id="' + pkg.id + '">删除</button>'),
    'modal--sm');
}

/* ---------- 弹窗：设为默认套餐 ----------
   默认套餐只能从本行业名下的套餐里指定，每个行业恰好一个（§2.4）。
   默认位只决定"本行业新建门店的初始关联套餐"，不回溯已建门店——
   门店恒关联一个套餐包，本店生效套餐恒为本店关联套餐（§2.5）。
   原默认套餐本身不删除，只是默认位改挂到本套餐。 */
function openPkgSetDefault(pkgId) {
  const pkg = packageById(pkgId);
  if (!pkg) return;
  const cur = packageById(industryDefault[pkg.industry]);
  if (cur && cur.id === pkg.id) return;
  const body =
    '<div class="field-hint" style="font-size:13px;line-height:1.8">' +
    '「' + esc(pkg.industry) + '」行业当前的默认套餐是「' + (cur ? esc(cur.name) : '—') + '」。' +
    '设为默认后，本行业新建的门店账号默认关联本套餐；已建门店各按本店关联套餐计费，不受影响。<br>' +
    '原默认套餐不会被删除，只是默认位改挂到「' + esc(pkg.name) + '」。</div>';

  openModal('设为默认套餐', body,
    '<button class="btn" data-close="1">取消</button>' +
    '<button class="btn btn--primary" data-action="pkg-default-save" data-id="' + pkg.id + '">设为默认</button>',
    'modal--sm');
}

/* ---------- 渲染调度 ---------- */
function render() {
  renderTopbar();
  let html = '';
  if (state.route === 'store-list') html = renderStoreList();
  else if (state.route === 'store-detail') html = renderStorePage();
  else if (state.route === 'packages') html = renderPackages();
  $('#content').innerHTML = html;
  $('#content').scrollTop = 0;
}

/* ---------- 事件绑定 ---------- */
document.addEventListener('click', function (e) {
  const inMenu = e.target.closest('#menuRoot');
  if (!inMenu && !e.target.closest('[data-store-menu]')) closeRowMenu();

  const t = e.target.closest('[data-nav-toggle],[data-route],[data-close],[data-action],[data-store-detail],' +
    '[data-store-edit],[data-store-login],[data-store-menu],[data-menu-act],' +
    '[data-acct-edit],[data-acct-human],[data-acct-more],' +
    '[data-senior-config],[data-pkg-default],[data-pkg-edit],[data-pkg-del],[data-page],' +
    '[data-senior-toggle],[data-senior-budget],[data-senior-brand]');
  if (!t) return;

  if (t.dataset.close) { closeOverlay(); return; }
  if (t.dataset.navToggle) { t.classList.toggle('is-open'); return; }
  if (t.dataset.route) { closeOverlay(); go(t.dataset.route); return; }

  // 门店列表
  if (t.dataset.storeDetail) { go('store-detail/' + t.dataset.storeDetail); return; }
  if (t.dataset.storeEdit) { openVipEdit(t.dataset.storeEdit); return; }
  if (t.dataset.storeLogin) { toast('已在新窗口打开该门店的客户端'); return; }
  if (t.dataset.storeMenu) {
    const wasOpen = !!$('#menuRoot').firstChild;
    closeRowMenu();
    if (!wasOpen) openRowMenu(t.dataset.storeMenu, t);
    return;
  }
  if (t.dataset.menuAct) {
    const id = t.dataset.menuStore, act = t.dataset.menuAct;
    closeRowMenu();                       // 先收菜单再开浮层，避免两层叠在一起
    if (act === 'vip') openVipEdit(id);
    else if (act === 'garage') openGarageDocs(id);
    else if (act === 'pkg') openPkgDrawer(id);
    else if (act === 'account') openAccountDrawer(id);
    return;
  }
  if (t.dataset.openPlatform) { closeOverlay(); go('store-detail/' + t.dataset.openPlatform); return; }

  // 平台账号
  if (t.dataset.acctEdit) { toast('编辑平台账号信息'); return; }
  if (t.dataset.acctHuman) { toast('配置该账号的数字人'); return; }
  if (t.dataset.acctMore) { toast('更多操作'); return; }
  if (t.dataset.seniorConfig) { openSeniorConfig(t.dataset.seniorConfig); return; }

  // 套餐包管理
  if (t.dataset.pkgDefault) { openPkgSetDefault(t.dataset.pkgDefault); return; }
  if (t.dataset.pkgEdit) { openPkgEdit(t.dataset.pkgEdit); return; }
  if (t.dataset.pkgDel) { openPkgDelete(t.dataset.pkgDel); return; }

  // 高级结算抽屉内的开关
  if (t.dataset.seniorToggle) {
    const on = t.classList.toggle('is-on');
    $$('.drawer-body .input').forEach(i => { if (i.dataset.seniorPrice) i.disabled = !on; });
    return;
  }
  if (t.dataset.seniorBudget) { t.classList.toggle('is-on'); return; }
  if (t.dataset.seniorBrand) { t.classList.toggle('is-on'); return; }

  // 分页
  if (t.dataset.page) { state.page = parseInt(t.dataset.page, 10); render(); return; }

  // 动作
  const act = t.dataset.action;
  if (!act) return;
  if (act === 'store-search' || act === 'acct-search') { state.page = 1; render(); return; }
  if (act === 'store-reset') { state.storeKeyword = ''; state.storeIndustry = ''; state.page = 1; render(); return; }
  if (act === 'acct-reset') { state.acctKeyword = ''; state.acctUid = ''; state.acctHuman = ''; render(); return; }

  if (act === 'open-vip') { openVipEdit(t.dataset.id); return; }
  if (act === 'pkg-add') { openPkgEdit(null); return; }
  if (act === 'export-recharge') { toast('已导出该门店的充值记录'); return; }

  // 保存
  if (act === 'pkg-del-confirm') {
    const i = packages.findIndex(p => p.id === t.dataset.id);
    if (i < 0) return;
    const name = packages[i].name;
    packages.splice(i, 1);
    closeOverlay(); toast('已删除「' + name + '」'); render(); return;
  }
  if (act === 'pkg-save') {
    const name = $('#pkgName').value.trim();
    if (!name) { toast('请输入套餐名称', true); return; }
    // 所属行业是套餐的必填项（§9.3）：计费链路上不存在"没有归属"的套餐
    const industry = $('#pkgIndustry').value;
    if (!industry) { toast('请选择所属行业', true); return; }
    const min = parseInt($('#pkgMin').value, 10);
    if (!min || min < 1) { toast('请输入大于 0 的整数月最低消耗', true); return; }

    // 五个岗位单价均为必配项，留空即不予保存（§9.3）
    const prices = {};
    const blank = [];
    let invalid = null;
    $$('[data-pkg-price]').forEach(i => {
      const raw = i.value.trim();
      if (raw === '') { blank.push(i.dataset.pkgPrice); prices[i.dataset.pkgPrice] = null; return; }
      const v = parseInt(raw, 10);
      if (!v || v < 1) invalid = i.dataset.pkgPrice;
      prices[i.dataset.pkgPrice] = v || null;
    });
    if (blank.length) { toast('「' + blank.join('、') + '」的单价不能为空', true); return; }
    if (invalid) { toast('「' + invalid + '」的单价需为大于 0 的整数', true); return; }

    const note = $('#pkgNote').value.trim();
    const old = packageById(t.dataset.id);
    const reasons = old ? usageReasons(old) : [];

    // 已关联门店、或已是本行业默认套餐的，所属行业不可改（表单里也做了禁用，
    // 这里再拦一道，防止改动绕过表单）
    if (old && reasons.length && old.industry !== industry) {
      toast('该套餐' + reasons.join('，') + '，所属行业不可修改', true); return;
    }

    if (old) { old.name = name; old.industry = industry; old.note = note; old.prices = prices; old.monthlyMinimum = min; }
    else {
      // 编号取现有最大值 +1，删除套餐后不回收，避免与新套餐撞号
      const n = packages.reduce((a, p) => Math.max(a, parseInt(p.id.slice(1), 10) || 0), 0) + 1;
      packages.push({ id: 'p' + n, name: name, industry: industry, note: note, prices: prices, monthlyMinimum: min });
    }
    closeOverlay();
    toast(old && reasons.length
      ? '已保存，该套餐' + reasons.join('，') + '，改动立即生效' : '已保存');
    render(); return;
  }
  if (act === 'pkg-default-save') {
    const pkg = packageById(t.dataset.id);
    if (!pkg) return;
    const before = packageById(industryDefault[pkg.industry]);
    industryDefault[pkg.industry] = pkg.id;
    closeOverlay();
    toast('「' + pkg.industry + '」行业的默认套餐已改为「' + pkg.name + '」' +
      (before && before.id !== pkg.id ? '，原「' + before.name + '」不再作为默认' : '') + '，立即生效');
    render(); return;
  }
  if (act === 'pkg-assign') {
    const s = stores.find(x => x.id === t.dataset.id) || currentStore();
    const before = packageById(s.packageId);
    // 门店恒有绑定，下拉不给"未关联"，所以这里拿到的一定是个有效套餐 id
    const after = packageById($('#pkgSelect').value);
    if (!after) { toast('请选择一个套餐包', true); return; }
    s.packageId = after.id;
    closeOverlay();
    toast('已关联「' + after.name + '」' + (before && before.id !== after.id ? '，原「' + before.name + '」不再生效' : ''));
    render(); openPkgDrawer(s.id); return;
  }
  if (act === 'senior-save') {
    const s = currentStore();
    const a = (platformAccounts[s.id] || []).find(x => x.id === t.dataset.id);
    if (!a) return;
    const on = document.querySelector('[data-senior-toggle]').classList.contains('is-on');
    if (!on) { a.settlement = 'basic'; a.senior = null; closeOverlay(); toast('已关闭高级结算，该账号恢复基础结算'); render(); return; }
    const prices = {};
    let missing = false;
    $$('[data-senior-price]').forEach(i => {
      const v = parseInt(i.value, 10);
      if (!v || v < 1) missing = true;
      prices[i.dataset.seniorPrice] = v || 0;
    });
    if (missing) { toast('请填写全部四档线索单价', true); return; }
    a.settlement = 'advanced';
    a.senior = {
      prices: prices,
      rules: {
        cities: (($('.drawer-body .input[placeholder="请选择省/市"]') || {}).value || '').split('、').filter(Boolean),
        models: ($('.drawer-body .input[placeholder="请选择热卖车型"]') || {}).value || '',
        budgetEnabled: document.querySelector('[data-senior-budget]').classList.contains('is-on'),
        budgetMin: ($('.drawer-body .input[placeholder="可结算预算下限"]') || {}).value || '',
        budgetMax: ($('.drawer-body .input[placeholder="可结算预算上限"]') || {}).value || '',
        brandEnabled: document.querySelector('[data-senior-brand]').classList.contains('is-on')
      }
    };
    closeOverlay(); toast('已保存'); render(); return;
  }
  if (act === 'vip-save') {
    const s = stores.find(x => x.id === t.dataset.id);
    const prevStatus = s.payStatus;
    const payStatus = radioValue('vipStatus') || prevStatus;
    const rcType = radioValue('vipType') || '付费充值';
    const switched = payStatus !== prevStatus;
    const d = parseInt($('#vipDays').value, 10) || 0;
    const p = parseInt($('#vipPower').value, 10) || 0;
    if (!d && !p) { toast('请填写到期天数或电力值调整', true); return; }
    // 单笔上限 100,000 电力值：充值、扣减双向都卡，按绝对值判定（§9.1 / §6.2）
    if (Math.abs(p) > VIP_POWER_LIMIT) { toast('单笔电力值调整不能超过 ' + num(VIP_POWER_LIMIT), true); return; }
    // 切换了付费状态 → 以「当日」为基准重算到期时间；未切换 → 在原到期时间上顺延（§9.1）
    if (d) s.expiresAt = addDays(switched ? TODAY : s.expiresAt.slice(0, 10), d) + ' 23:59:59';
    s.payStatus = payStatus;
    // 负数的电力值调整是扣减，不是充值：账本里类型记「—」，也不重置低消周期
    const isDeduction = p < 0;
    if (p) {
      const before = s.balance;
      // 只有正向入账才可能抵扣负值；负数调整是扣减，不产生「抵扣」
      const deduct = (p > 0 && before < 0) ? Math.min(p, -before) : 0;
      s.balance = before + p;
      const list = recharges[s.id] || (recharges[s.id] = []);
      const now = TODAY + ' ' + new Date().toTimeString().slice(0, 8);
      list.push({
        id: 'R' + now.replace(/[-: ]/g, '') + '-VIP', amount: p, before: before, after: s.balance,
        type: isDeduction ? '—' : rcType,
        arrivedAt: now, loggedAt: now, operator: '王敏',
        remark: p < 0 ? 'VIP 调整，扣减电力值'
          : (deduct > 0 ? '补充电力值，抵扣' + num(deduct) + '电力值' : '补充电力值')
      });
    }
    // 低消周期只在「触发重置的充值」时重新起算（§4.1）：三类续约型重置、「赠送」不重置、
    // 负数扣减不算充值。周期的刷新点全部收在这里——冻结/解冻本身不再改写周期（§5.3）
    const cycleReset = !isDeduction && RECHARGE_RENEWS[rcType];
    if (cycleReset) {
      // 到账当天不计入周期：起算日是到账日的次日，末日是到账日 + 31 天（§4.1）
      s.cycleStartAt = addDays(TODAY, 1);
      s.cycleEndAt = addDays(TODAY, 31);
      s.cycleConsumed = sumPower(cycleFeesOf(s));   // 按新窗口重算，不手填 0
    }
    // 减少付费时间导致截止日早于当前时间 → 立即冻结（§9.2）
    if (serviceRemainDays(s) <= 0) {
      s.status = 'frozen';
      s.frozenPower = Math.max(0, s.balance);
      closeOverlay();
      toast('服务期截止日已早于当前时间，账户立即冻结', true);
      render(); return;
    }
    const thawed = s.status === 'frozen';
    if (thawed) { s.status = 'normal'; s.frozenPower = 0; }
    const bits = [];
    if (p) bits.push('已自动生成充值记录');
    if (cycleReset) bits.push('低消周期重新起算 31 天');
    else if (thawed) bits.push('低消周期未重置');
    closeOverlay();
    toast((thawed ? '已解冻' : 'VIP 信息已保存') + (bits.length ? '，' + bits.join('，') : ''));
    render(); return;
  }
});

// 筛选项录入（不触发重渲染，等「查找」）
document.addEventListener('input', function (e) {
  const f = e.target.dataset.filter;
  if (f) state[f] = e.target.value;
});
document.addEventListener('change', function (e) {
  const ps = e.target.dataset.pagesize;
  if (ps === 'data-page') { state.perPage = parseInt(e.target.value, 10); state.page = 1; render(); return; }
  const f = e.target.dataset.filter;
  if (f) { state[f] = e.target.value; }
});

// 遮罩点击与 Esc 关闭
$('#mask').addEventListener('click', closeOverlay);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });
$('#content').addEventListener('scroll', closeRowMenu, true);
window.addEventListener('resize', closeRowMenu);
$('#navCollapse').addEventListener('click', function () {
  const sb = $('#sidebar');
  sb.classList.toggle('is-collapsed');
  this.textContent = sb.classList.contains('is-collapsed') ? '»' : '«';
});

/* ---------- 启动 ---------- */
renderNav();
parseHash();
if (!location.hash) location.hash = '#/store-list';
render();
window.addEventListener('hashchange', function () { parseHash(); closeOverlay(); render(); });
})();
</script>
</body>
</html>
